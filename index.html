<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Mypdftools</title>
  <meta name="description" content="Merge, split, compress, convert, sign and protect PDFs in your browser. Your files never leave your device.">
  <meta name="theme-color" content="#03080a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/" aria-label="Mypdftools home"><img src="icon.svg" alt="" width="28" height="28"> Mypdftools</a>
    <p class="promise"><span class="dot" aria-hidden="true"></span> Files stay on this device</p>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    <p>Nothing is uploaded. Every tool runs inside this browser tab, and the page's security policy blocks it from sending your files anywhere.</p>
  </footer>
  <div id="toast" role="alert"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
